# This setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are
# Android operating system, and which are packaged with your app.
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
kotlin.jvm.target.validation.mode=warning

